plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 签名信息仅保存在开发者本机，避免私钥与密码进入源码仓库。
def releaseSigningPropertiesFile = rootProject.file('keystore.properties')
def releaseSigningProperties = new Properties()
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningPropertiesFile.withInputStream { inputStream ->
        releaseSigningProperties.load(inputStream)
    }
    def requiredSigningKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
    def missingSigningKeys = requiredSigningKeys.findAll { !releaseSigningProperties[it] }
    if (!missingSigningKeys.isEmpty()) {
        throw new GradleException("keystore.properties 缺少配置项：${missingSigningKeys.join(', ')}")
    }
}

android {
    namespace 'com.hss.myroutin'
    compileSdk 34

    defaultConfig {
        applicationId "com.hss.myroutin"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "2.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            // 未配置时保留空配置，使 assembleRelease 明确报错，禁止误发 debug 签名包。
            if (releaseSigningPropertiesFile.exists()) {
                storeFile rootProject.file(releaseSigningProperties['storeFile'])
                storePassword releaseSigningProperties['storePassword']
                keyAlias releaseSigningProperties['keyAlias']
                keyPassword releaseSigningProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.3.2'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all {
            // 输出文件名带上版本号，方便发包时区分安装包版本。
            outputFileName = "MyRoutin-${variant.versionName}.apk"
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    implementation 'com.google.android.material:material:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}
