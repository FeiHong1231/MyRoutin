name: Build Android Release

on:
  push:
    tags:
      - "v*"

# 仅授予创建 GitHub Release 所需的仓库内容写入权限。
permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Restore release signing files
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > myroutin-release.jks
          printf '%s\n' \
            "storeFile=myroutin-release.jks" \
            "storePassword=$KEYSTORE_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "keyPassword=$KEY_PASSWORD" > keystore.properties

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version_name="${TAG_NAME#v}"
          configured_version_name="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' app/build.gradle | head -n 1)"
          version_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' app/build.gradle | head -n 1)"
          apk_path="app/build/outputs/apk/release/MyRoutin-${version_name}.apk"
          test "$TAG_NAME" != "$version_name"
          test "$version_name" = "$configured_version_name"
          test -n "$version_code"
          test -f "$apk_path"
          sha256="$(sha256sum "$apk_path" | awk '{print $1}')"
          apk_size_bytes="$(wc -c < "$apk_path" | tr -d '[:space:]')"
          # 保留旧仓库前缀；GitHub 会将其重定向到迁移后的仓库，旧版本客户端才能通过地址白名单校验。
          apk_url="https://github.com/huangssh/MyRoutin/releases/download/${TAG_NAME}/MyRoutin-${version_name}.apk"
          printf '{\n  "versionCode": %s,\n  "versionName": "%s",\n  "apkUrl": "%s",\n  "sha256": "%s",\n  "apkSizeBytes": %s\n}\n' \
            "$version_code" "$version_name" "$apk_url" "$sha256" "$apk_size_bytes" > update.json
          release_notes_file="release-notes/v${version_name}.md"
          if [ -f "$release_notes_file" ]; then
            gh release create "$TAG_NAME" "$apk_path" "update.json#update.json" \
              --title "MyRoutin ${version_name}" \
              --notes-file "$release_notes_file"
          else
            gh release create "$TAG_NAME" "$apk_path" "update.json#update.json" \
              --title "MyRoutin ${version_name}" \
              --generate-notes
          fi
